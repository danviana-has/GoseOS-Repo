[package]
name = "gose_base"
version = "0.2.0"
edition = "2021"
authors = ["Guilherme - GOSE Project"]
description = "GOSE Utilities Base - Modular Multi-Server Ring 3 ELF Suite for Margay Microkernel"

[lib]
name = "gose_sdk"
path = "src/lib.rs"

[[bin]]
name = "goseinit"
path = "src/bin/goseinit.rs"

[[bin]]
name = "drivergop"
path = "src/bin/drivergop.rs"

[[bin]]
name = "driverps2"
path = "src/bin/driverps2.rs"

[[bin]]
name = "driverfs"
path = "src/bin/driverfs.rs"

[[bin]]
name = "gosebi"
path = "src/bin/gosebi.rs"

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
strip = true
