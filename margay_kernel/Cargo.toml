[package]
name = "margay_kernel"
version = "0.1.0"
edition = "2021"
authors = ["Guilherme - GOSE Project"]
description = "Margay Microkernel - 3rd-generation pure x86_64 microkernel for GOSE"

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1
debug = true
overflow-checks = false

[profile.release]
panic = "abort"
opt-level = 2
lto = false
codegen-units = 1
debug = true
overflow-checks = false
